# Configuración de MiniDB.
#
# Se lee al arrancar. Si el archivo no existe se usan estos mismos valores por
# defecto. Un path pasado por la línea de órdenes tiene prioridad sobre
# data_file.

# Archivo binario de la base de datos. Todas las páginas viven aquí: cabecera,
# catálogo, datos de la tabla, índice hash y páginas de overflow.
data_file = data/minidb.db

# Número de frames que el Buffer Pool mantiene en RAM. Cada frame ocupa una
# página (4096 bytes). La operación más costosa (un UPDATE que reubica un
# registro) fija 6 páginas a la vez, así que 8 deja margen.
buffer_pool_frames = 8

# Modelo de ejecución de los escaneos completos.
#
#   false  Volcano tupla a tupla: Next() devuelve un registro (por defecto).
#   true   Vectorizado por lotes: Next() devuelve un lote de ~1024 registros,
#          el escaneo fija cada página una sola vez y el filtro compara sobre
#          una columna contigua.
#
# Se puede cambiar en caliente con .vectorizado on|off, y comparar los dos
# modelos con .benchvec.
vectorized = false
